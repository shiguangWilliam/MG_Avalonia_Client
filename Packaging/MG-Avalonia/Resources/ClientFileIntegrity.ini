; Client file integrity whitelist for ClientAvalonia startup verification.
; Paths are relative to the game install root (InstallPath in registry).
;
; [Files]     — single-file entries: RelativePath=SHA256 (lowercase hex, no dashes)
; [Directories] — directory whitelist: RelativeDir=* or flat|recursive
;                 Every file under the directory must have a matching [Files] entry;
;                 unexpected files on disk are treated as tampering.

[Settings]
Enabled=no
ManifestVersion=1

[Files]
; Example single-file entries (hashes are placeholders — replace with real values):
; gamemd.exe=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
; Syringe.exe=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
; ClientAvalonia.exe=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

[Directories]
; Example directory coverage (requires a [Files] hash for each file in the tree):
; Resources/ClientAvalonia=recursive
; INI/Base=flat
