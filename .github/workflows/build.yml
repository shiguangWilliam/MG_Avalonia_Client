name: build client

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
jobs:
  build-clients:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json

    - name: Build
      run: ./Scripts/build.ps1
      shell: pwsh

    - name: Test ClientAvalonia (unit tests, no integration)
      run: |
        dotnet test ClientAvalonia.Tests/ClientAvalonia.Tests.csproj `
          -c Debug `
          --filter "Category!=Integration" `
          --collect:"XPlat Code Coverage" `
          -- RunConfiguration.TreatNoTestsAsError=false
      shell: pwsh

    - name: Build ClientAvalonia (for integration smoke tests)
      run: dotnet build ClientAvalonia/ClientAvalonia.csproj -c Debug
      shell: pwsh

    - name: Test ClientAvalonia (integration smoke tests, optional)
      continue-on-error: true
      run: |
        dotnet test ClientAvalonia.Tests/ClientAvalonia.Tests.csproj `
          -c Debug `
          --filter "Category=Integration" `
          -- RunConfiguration.TreatNoTestsAsError=false
      shell: pwsh

    - uses: actions/upload-artifact@v4
      name: Upload Artifacts
      with:
        name: artifacts
        path: ./Compiled
